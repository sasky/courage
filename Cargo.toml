[package]
name = "courage"
version = "0.1.0"
edition = "2021"
description = "Personal relationship database with voice input"
authors = ["Cam"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Telegram bot
teloxide = { version = "0.13", features = ["macros"] }

# HTTP client for APIs
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# File watching (for future use)
notify = "6"

# Markdown frontmatter parsing
gray_matter = "0.2"

# UUID for message IDs
uuid = { version = "1", features = ["v4"] }

# Regex for parsing
regex = "1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
